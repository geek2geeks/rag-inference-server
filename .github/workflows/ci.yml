# CI for rag-inference-server.
# Owner decision 2026-11-22: all CI runs locally on the self-hosted Windows runner.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  python-syntax:
    name: Python 3.10 syntax check
    runs-on: [self-hosted, Windows, X64, rag-inference-server]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show versions
        run: |
          python --version
          python -m pip --version

      - name: Install declared dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Byte-compile all Python sources
        run: python -m compileall -q src
